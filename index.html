<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOIN RGB Lab</title><meta name="description" content="RGBの色と2進法・10進法・16進法の対応を学ぶ授業用シミュレーター"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f9;color:#182238;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}main{max-width:1460px;margin:auto;padding:28px 36px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}h1{font-size:32px;margin:0;letter-spacing:-1px}h1 span{color:#6366db}p{line-height:1.7}header p{margin:5px 0 0;color:#576277}button,input{font:inherit}button{cursor:pointer;background:white;border:1px solid #cbd1df;border-radius:10px;padding:10px 16px;font-weight:650;color:#24304b}button:hover{background:#e9ecfa}button:focus-visible,input:focus-visible{outline:3px solid #5b5bd6;outline-offset:3px}.layout{display:grid;grid-template-columns:1fr 1.55fr;gap:24px}.preview,.panel,.lesson{background:white;border:1px solid #e0e4ed;border-radius:20px;padding:24px}.swatch{height:270px;border-radius:14px;border:1px solid #0002;transition:background .08s}.label{font-size:14px;font-weight:750;color:#5c6679;letter-spacing:1px}.code{display:flex;align-items:center;gap:12px;margin:18px 0}.code input{width:100%;min-width:0;border:0;background:#f2f3f8;border-radius:10px;padding:12px;font:700 clamp(26px,3vw,44px) ui-monospace,monospace;text-transform:uppercase}.code input[type=color]{width:58px;height:58px;padding:4px;flex-shrink:0;cursor:pointer}.presets{display:flex;gap:9px;flex-wrap:wrap}.preset{width:38px;height:38px;padding:0;border:2px solid #c8cdd8;border-radius:50%}.hint{color:#5b6577;font-size:14px}.row{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid #e6e8ef}.row:last-child{border:0;margin:0;padding:0}.rowhead{display:flex;align-items:center;gap:12px}.badge{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--tint);color:var(--ink);font-size:25px;font-weight:800}.name{font-size:19px;font-weight:700;flex:1}.decimal{width:105px;font-size:32px;font-weight:750;text-align:center;border:1px solid #cbd1df;border-radius:10px;padding:5px;color:var(--ink)}input[type=range]{width:100%;height:30px;margin:12px 0;accent-color:var(--ink);cursor:pointer}.values{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}.value{background:#f4f5f9;padding:12px 15px;border-radius:12px}.number{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:clamp(25px,2.8vw,39px);font-weight:750;letter-spacing:1px;white-space:nowrap}.number .half:first-child{color:var(--ink)}.number .half+ .half{margin-left:10px}.bit{border:0;background:none;padding:0;color:inherit;font:inherit;border-radius:3px}.bit:hover{background:#dce0f0}.lesson{margin-top:24px;display:flex;gap:24px;align-items:center}.lesson h2{margin:0 0 8px;font-size:19px}.lesson p{margin:0;color:#586276}.formula{font:700 25px ui-monospace,monospace;white-space:nowrap;background:#f2f3f9;border-radius:12px;padding:16px}.foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;font-size:14px;color:#647084}.hidden .binary{display:none}#error{color:#ad1838;min-height:20px;font-size:14px}body.large main{max-width:1700px}body.large .number{font-size:clamp(29px,3.3vw,49px)}@media(max-width:950px){.layout{grid-template-columns:1fr}.swatch{height:190px}.lesson{display:block}.formula{margin-top:15px;white-space:normal}header{align-items:flex-start}.values{grid-template-columns:1.6fr 1fr}}@media(max-width:520px){main{padding:20px 14px}header{display:block}header button{margin-top:12px}.panel,.preview,.lesson{padding:18px}.number{font-size:27px}.values{gap:8px}.value{padding:10px}.foot{display:block}}
/* RGBを主役に、プレビューを右の小さな補助パネルに配置 */
.layout{grid-template-columns:minmax(0,1fr) 280px;align-items:start}.panel{grid-column:1;grid-row:1}.preview{grid-column:2;grid-row:1;padding:18px}.swatch{height:140px}.code{gap:7px;margin:14px 0}.code input{font-size:23px;padding:9px}.code input[type=color]{width:40px;height:44px}.preset{width:28px;height:28px}.presets{gap:7px}.preview .hint{font-size:13px}.preview>button{font-size:13px;padding:9px 10px}.preview>.label{font-size:12px}
@media(max-width:950px){.layout{grid-template-columns:minmax(0,1fr) 220px}.preview{padding:14px}.code input{font-size:19px}.code input[type=color]{width:34px;height:38px}.number{font-size:29px}}
@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{grid-column:1;grid-row:1}.preview{grid-column:1;grid-row:2}.swatch{height:110px}.code input{font-size:26px}.number{font-size:clamp(25px,6vw,34px)}}
</style><main><header><div><h1>SHOIN <span>RGB Lab</span></h1><p>色を動かす。数字の表し方を比べる。</p></div><button id="fullscreen">画面いっぱいに表示 ↗</button></header><div class="layout"><section class="preview" aria-label="合成した色"><div class="label">COLOR PREVIEW</div><div class="swatch" id="swatch" style="margin-top:14px"></div><div class="code"><input id="hexcode" aria-label="16進法カラーコード" maxlength="7" spellcheck="false"><input type="color" id="picker" aria-label="色を選択"></div><div id="error" role="status"></div><div class="presets" id="presets"></div><p class="hint">カラーコードは #RRGGBB。2桁ずつが赤・緑・青の強さを表します。</p><button id="random">ランダムな色</button> <button id="reset">リセット</button></section><section class="panel" aria-label="RGBの値と進法変換" id="channels"></section></div><section class="lesson"><div><h2>2進法4桁 ＝ 16進法1桁</h2><p>各色は8ビット（0〜255）。上位4ビット・下位4ビットを分けると、16進法2桁に対応します。<br>2進法の各桁をクリックして、ビットを切り替えることもできます。</p></div><div class="formula">1111 1111₂ = FF₁₆ = 255₁₀</div></section><div class="foot"><span>RGB各8ビット × 3色 ＝ 24ビット ／ 16,777,216色</span><label><input type="checkbox" id="binaryToggle" checked> 2進法を表示</label></div></main><script>
const rgb=[255,128,64], names=['Red / 赤','Green / 緑','Blue / 青'], inks=['#bb2745','#087c55','#2859c8'],tints=['#ffedf0','#e6f7ee','#eaf0ff'];
const $=s=>document.querySelector(s);function hex(v){return v.toString(16).padStart(2,'0').toUpperCase()}function update(){const code='#'+rgb.map(hex).join('');$('#swatch').style.background=code;$('#hexcode').value=code;$('#picker').value=code;rgb.forEach((v,i)=>{const b=v.toString(2).padStart(8,'0');$('#dec'+i).value=v;$('#range'+i).value=v;$('#bin'+i).innerHTML=[0,4].map(start=>'<span class="half">'+b.slice(start,start+4).split('').map((n,j)=>'<button class="bit" data-i="'+i+'" data-bit="'+(7-start-j)+'" aria-label="'+names[i]+' '+Math.pow(2,7-start-j)+'の位 '+n+' 切り替え">'+n+'</button>').join('')+'</span>').join('');$('#hex'+i).innerHTML='<span class="half">'+hex(v)[0]+'</span><span class="half">'+hex(v)[1]+'</span>';});}
$('#channels').innerHTML=rgb.map((v,i)=>`<div class="row" style="--ink:${inks[i]};--tint:${tints[i]}"><div class="rowhead"><span class="badge">${'RGB'[i]}</span><label class="name" for="dec${i}">${names[i]}</label><input class="decimal" id="dec${i}" type="number" min="0" max="255" step="1" aria-label="${names[i]}の10進法値"></div><input type="range" id="range${i}" min="0" max="255" value="${v}" aria-label="${names[i]}の強さ"><div class="values"><div class="value binary"><div class="label">2進法 · 8ビット</div><div class="number" id="bin${i}"></div></div><div class="value"><div class="label">16進法</div><div class="number" id="hex${i}"></div></div></div></div>`).join('');
rgb.forEach((_,i)=>{['range','dec'].forEach(type=>$('#'+type+i).addEventListener('input',e=>{if(e.target.value==='')return;rgb[i]=Math.max(0,Math.min(255,Math.round(Number(e.target.value)||0)));update()}));$('#dec'+i).addEventListener('change',update)});
function setCode(code){if(!/^#[0-9a-f]{6}$/i.test(code))return false;rgb.splice(0,3,...[1,3,5].map(n=>parseInt(code.slice(n,n+2),16)));$('#error').textContent='';update();return true}
$('#hexcode').addEventListener('input',e=>{let v=e.target.value.trim();if(!v.startsWith('#'))v='#'+v;if(setCode(v))$('#error').textContent='';else $('#error').textContent='16進法6桁で入力してください（例：#FF8040）';});$('#hexcode').addEventListener('blur',()=>{update();$('#error').textContent=''});$('#picker').addEventListener('input',e=>setCode(e.target.value));document.addEventListener('click',e=>{const b=e.target.closest('[data-bit]');if(b){rgb[+b.dataset.i]^=1<<(+b.dataset.bit);update()}});
const presets=[['赤','#FF0000'],['緑','#00FF00'],['青','#0000FF'],['黄','#FFFF00'],['シアン','#00FFFF'],['マゼンタ','#FF00FF'],['白','#FFFFFF'],['黒','#000000']];presets.forEach(([name,c])=>{const b=document.createElement('button');b.className='preset';b.style.background=c;b.title=name;b.setAttribute('aria-label',name);b.onclick=()=>setCode(c);$('#presets').append(b)});$('#random').onclick=()=>{rgb.splice(0,3,...rgb.map(()=>Math.floor(Math.random()*256)));update()};$('#reset').onclick=()=>setCode('#FF8040');$('#binaryToggle').onchange=e=>$('#channels').classList.toggle('hidden',!e.target.checked);$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.body.classList.toggle('large')}};document.addEventListener('fullscreenchange',()=>{$('#fullscreen').textContent=document.fullscreenElement?'全画面を終了 ↙':'画面いっぱいに表示 ↗'});update();
</script></html>
